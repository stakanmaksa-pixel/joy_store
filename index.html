<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  .wrap{ max-width: 1040px; margin: 0 auto; padding: 40px 24px 96px; }
  .crumbs{
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .crumbs a{ color: var(--muted); text-decoration: none; }
  .crumbs a:hover{ color: var(--accent-2); }
  h1{ font-size: clamp(28px, 4.5vw, 42px); margin: 0 0 28px; font-weight: 700; letter-spacing: -0.02em; }

  /* --- Плитки категорий / моделей --- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .tile{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 20px;
    text-decoration: none;
    color: var(--text);
    display:flex; flex-direction:column; gap:8px;
    transition: border-color .15s, transform .15s;
  }
  .tile:hover{ border-color: var(--accent-2); transform: translateY(-2px); }
  .tile .tile-name{ font-size: 18px; font-weight: 600; }
  .tile .tile-sub{ font-size: 13px; color: var(--muted); }

  /* --- Товарная страница --- */
  .layout{ display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; }
  @media (max-width: 800px){ .layout{ grid-template-columns: 1fr; } }
  .stage{
    background: radial-gradient(circle at 30% 20%, #1e2530, var(--panel) 70%);
    border: 1px solid var(--line);
    border-radius: 24px;
    aspect-ratio: 1 / 1;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .stage .visual{
    width: 46%;
    aspect-ratio: 9/19;
    border-radius: 34px;
    border: 2px solid rgba(255,255,255,.14);
    background: linear-gradient(160deg, var(--v-a, #3a5fce), var(--v-b, #17203a));
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
  }
  .panel{ display:flex; flex-direction:column; gap: 28px; }
  .group-label{ font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .options{ display:flex; flex-wrap: wrap; gap: 8px; }
  .opt{
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .opt:hover{ border-color: var(--accent-2); }
  .opt.active{ border-color: var(--accent); background: var(--panel-2); box-shadow: 0 0 0 1px var(--accent) inset; }
  .opt.color-opt{ display:flex; align-items:center; gap:8px; }
  .swatch{ width: 14px; height:14px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); }
  .price-block{ margin-top: 8px; padding-top: 24px; border-top: 1px solid var(--line); }
  .price{ font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
  .price-note{ color: var(--muted); font-size: 13px; margin-top: 4px;}
  .buy{
    margin-top: 20px; width: 100%; padding: 16px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .buy:hover{ filter: brightness(1.08); }
  .state{ color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <div class="crumbs" id="crumbs"></div>
    <h1 id="pageTitle">Загрузка…</h1>
    <div id="app"><div class="state">Загружаю каталог…</div></div>
  </div>

<script>
const COLOR_HEX = {
  Blue:   { a: "#4f7cff", b: "#152036" },
  Orange: { a: "#ff9a4f", b: "#3a2114" },
  Silver: { a: "#c9d2de", b: "#3b4250" },
  Black:  { a: "#4a4f58", b: "#0c0d10" },
  White:  { a: "#f2f4f7", b: "#3b3f46" },
  Grey:   { a: "#8a8f98", b: "#242731" },
  "Nickel/Copper": { a: "#c98a5a", b: "#2b1c12" },
  "Vinca Blue":     { a: "#3f6fae", b: "#101b2c" },
  Lavender: { a: "#b6a6e8", b: "#2b2440" },
  Sage:     { a: "#9fae8f", b: "#232b1e" },
  "Mist Blue": { a: "#a9c3d8", b: "#1c2a34" },
};

const REGION_LABEL = {
  JP: "Япония 🇯🇵", HK: "Гонконг 🇭🇰", US: "США 🇺🇸", AE: "ОАЭ 🇦🇪",
  CN: "Китай 🇨🇳", RU: "Россия 🇷🇺", EU: "Евросоюз 🇪🇺", KR: "Корея 🇰🇷", UK: "Великобритания 🇬🇧",
  ESIM: "Только eSIM", SIM_ESIM: "SIM + eSIM",
};

function fmtPrice(n){ return new Intl.NumberFormat("ru-RU").format(n) + " ₽"; }

function hasAnyPriceData(node){
  if (typeof node === "number") return true;
  if (typeof node !== "object" || node === null) return false;
  return Object.values(node).some(hasAnyPriceData);
}

// Минимальная цена товара (для отображения "от X ₽" на карточке)
function getStartPrice(product){
  if (typeof product.price === "number") return product.price;
  if (!product.prices) return null;
  let min = null;
  (function walk(node){
    if (typeof node === "number"){ if (min === null || node < min) min = node; return; }
    if (typeof node === "object" && node !== null) Object.values(node).forEach(walk);
  })(product.prices);
  return min;
}

// Собирает доступные варианты памяти/цвета и диапазон цен по списку товаров - для фильтров
function collectFacets(products){
  const memories = new Set();
  const colors = new Set();
  let minPrice = null, maxPrice = null;

  function trackPrice(v){
    if (typeof v !== "number") return;
    if (minPrice === null || v < minPrice) minPrice = v;
    if (maxPrice === null || v > maxPrice) maxPrice = v;
  }

  products.forEach(p => {
    if (typeof p.price === "number"){ trackPrice(p.price); return; }
    if (!p.prices) return;
    if (p.hasMemory){
      Object.entries(p.prices).forEach(([mem, colorMap]) => {
        memories.add(mem);
        Object.entries(colorMap).forEach(([color, regionMap]) => {
          colors.add(color);
          Object.values(regionMap).forEach(trackPrice);
        });
      });
    } else {
      Object.entries(p.prices).forEach(([color, regionMap]) => {
        colors.add(color);
        Object.values(regionMap).forEach(trackPrice);
      });
    }
  });

  return {
    memories: [...memories],
    colors: [...colors],
    minPrice: minPrice ?? 0,
    maxPrice: maxPrice ?? 0,
  };
}

// Проверяет, есть ли у товара вариант с заданной памятью и/или цветом (для фильтрации)
function productMatchesFacets(product, selectedMemories, selectedColors){
  if (typeof product.price === "number"){
    // простой товар без памяти/цвета - проходит фильтр памяти/цвета всегда (нечего фильтровать)
    return true;
  }
  if (!product.prices){
    // товар-заготовка без данных вообще - не прячем его из-за фильтров, нечего фильтровать
    return true;
  }
  let matched = false;
  if (product.hasMemory){
    Object.entries(product.prices).forEach(([mem, colorMap]) => {
      if (selectedMemories.size && !selectedMemories.has(mem)) return;
      Object.keys(colorMap).forEach(color => {
        if (selectedColors.size && !selectedColors.has(color)) return;
        matched = true;
      });
    });
  } else {
    Object.keys(product.prices).forEach(color => {
      if (selectedColors.size && !selectedColors.has(color)) return;
      matched = true;
    });
  }
  return matched;
}

const params = new URLSearchParams(location.search);
const catKey = params.get("cat");
const subKey = params.get("sub");
const modelKey = params.get("model");
document.body.dataset.page = catKey ? "catalog" : "home";

function setCrumbs(parts){
  document.getElementById("crumbs").innerHTML = parts
    .map((p, i) => i < parts.length - 1 ? `<a href="${p.href}">${p.label}</a> / ` : p.label)
    .join("");
}

function emptyState(){
  return "<div class='state'>Товаров пока нет — скоро добавим.</div>";
}

function renderHome(data){
  setCrumbs([{label: "Каталог"}]);
  document.getElementById("pageTitle").textContent = "Каталог";
  const cats = Object.keys(data);
  document.getElementById("app").innerHTML = `<div class="grid">
    ${cats.map(c => {
      const brand = data[c];
      const count = brand.subcategories
        ? Object.keys(brand.subcategories).length
        : brand.products.length;
      const label = brand.subcategories ? "категорий" : "моделей";
      return `
      <a class="tile" href="?cat=${encodeURIComponent(c)}">
        <div class="tile-name">${brand.name}</div>
        <div class="tile-sub">${count} ${label}</div>
      </a>`;
    }).join("")}
  </div>`;
}

// Карточка товара для листинга (фото/заглушка + название + цена)
function productCardHTML(product, href){
  const startPrice = getStartPrice(product);
  const priceHTML = startPrice === null
    ? `<div class="card-price muted">Цена уточняется</div>`
    : `<div class="card-price">от ${fmtPrice(startPrice)}</div>`;

  let photoHTML;
  if (product.image){
    photoHTML = `<img src="${product.image}" alt="${product.name}" loading="lazy">`;
  } else {
    // Берём первый цвет товара для заглушки-градиента, если есть
    let firstColor = null;
    if (product.prices){
      if (product.hasMemory){
        const firstMem = Object.values(product.prices)[0];
        firstColor = firstMem ? Object.keys(firstMem)[0] : null;
      } else {
        firstColor = Object.keys(product.prices)[0];
      }
    }
    const hex = COLOR_HEX[firstColor] || { a: "#4f7cff", b: "#152036" };
    photoHTML = `<div class="card-visual" style="--v-a:${hex.a};--v-b:${hex.b};"></div>`;
  }

  return `
    <a class="product-card" href="${href}">
      <div class="card-photo">${photoHTML}</div>
      <div class="card-body">
        <div class="card-name">${product.name}</div>
        ${priceHTML}
      </div>
    </a>`;
}

// Листинг товаров с фильтрами (память/цвет/цена) и сортировкой
function renderListing(products, hrefBuilder){
  if (!products.length){
    document.getElementById("app").innerHTML = emptyState();
    return;
  }

  const facets = collectFacets(products);
  const state = {
    memories: new Set(),
    colors: new Set(),
    priceMin: facets.minPrice,
    priceMax: facets.maxPrice,
    sort: "default",
  };

  function applyFiltersAndRender(){
    let filtered = products.filter(p => {
      if (!productMatchesFacets(p, state.memories, state.colors)) return false;
      const start = getStartPrice(p);
      if (start === null) return true; // товары без цены не прячем - им "уточняется" всё равно интересно видеть
      return start >= state.priceMin && start <= state.priceMax;
    });

    if (state.sort === "price_asc"){
      filtered = filtered.slice().sort((a, b) => (getStartPrice(a) ?? Infinity) - (getStartPrice(b) ?? Infinity));
    } else if (state.sort === "price_desc"){
      filtered = filtered.slice().sort((a, b) => (getStartPrice(b) ?? -Infinity) - (getStartPrice(a) ?? -Infinity));
    } else if (state.sort === "name"){
      filtered = filtered.slice().sort((a, b) => a.name.localeCompare(b.name, "ru"));
    }

    document.getElementById("listingCount").textContent = `${filtered.length} из ${products.length}`;
    document.getElementById("listingGrid").innerHTML = filtered.length
      ? `<div class="grid">${filtered.map(p => productCardHTML(p, hrefBuilder(p.name))).join("")}</div>`
      : `<div class="state">Ничего не найдено по выбранным фильтрам.</div>`;
  }

  const hasVariants = facets.memories.length > 0 || facets.colors.length > 0;

  document.getElementById("app").innerHTML = `
    <div class="listing-layout">
      <aside class="filters">
        ${facets.memories.length ? `
        <div class="filter-group">
          <h4>Память</h4>
          ${facets.memories.map(m => `
            <label class="check"><input type="checkbox" data-filter="memory" value="${m}"> ${m}</label>
          `).join("")}
        </div>` : ""}
        ${facets.colors.length ? `
        <div class="filter-group">
          <h4>Цвет</h4>
          ${facets.colors.map(c => `
            <label class="check"><input type="checkbox" data-filter="color" value="${c}"> ${c}</label>
          `).join("")}
        </div>` : ""}
        <div class="filter-group">
          <h4>Цена, ₽</h4>
          <div class="price-range-inputs">
            <input type="number" id="priceMinInput" value="${facets.minPrice}" min="0">
            <span>—</span>
            <input type="number" id="priceMaxInput" value="${facets.maxPrice}" min="0">
          </div>
        </div>
      </aside>
      <div>
        <div class="listing-toolbar">
          <span class="listing-count" id="listingCount"></span>
          <select class="sort-select" id="sortSelect">
            <option value="default">По умолчанию</option>
            <option value="price_asc">Сначала дешевле</option>
            <option value="price_desc">Сначала дороже</option>
            <option value="name">По названию</option>
          </select>
        </div>
        <div id="listingGrid"></div>
      </div>
    </div>`;

  document.querySelectorAll('[data-filter="memory"]').forEach(el => {
    el.addEventListener("change", () => {
      el.checked ? state.memories.add(el.value) : state.memories.delete(el.value);
      applyFiltersAndRender();
    });
  });
  document.querySelectorAll('[data-filter="color"]').forEach(el => {
    el.addEventListener("change", () => {
      el.checked ? state.colors.add(el.value) : state.colors.delete(el.value);
      applyFiltersAndRender();
    });
  });
  document.getElementById("priceMinInput").addEventListener("change", (e) => {
    state.priceMin = Number(e.target.value) || 0;
    applyFiltersAndRender();
  });
  document.getElementById("priceMaxInput").addEventListener("change", (e) => {
    state.priceMax = Number(e.target.value) || facets.maxPrice;
    applyFiltersAndRender();
  });
  document.getElementById("sortSelect").addEventListener("change", (e) => {
    state.sort = e.target.value;
    applyFiltersAndRender();
  });

  applyFiltersAndRender();
}

function renderCategory(data, cat){
  const catData = data[cat];
  if (!catData){
    document.getElementById("app").innerHTML = "<div class='state'>Раздел не найден.</div>";
    return;
  }
  document.getElementById("pageTitle").textContent = catData.name;

  if (catData.subcategories){
    // Бренд с подкатегориями (Apple) - показываем плитки подкатегорий
    setCrumbs([{label: "Каталог", href: "?"}, {label: catData.name}]);
    const subs = Object.keys(catData.subcategories);
    document.getElementById("app").innerHTML = `<div class="grid">
      ${subs.map(s => {
        const sub = catData.subcategories[s];
        const count = sub.products.length;
        return `
        <a class="tile" href="?cat=${encodeURIComponent(cat)}&sub=${encodeURIComponent(s)}">
          <div class="tile-name">${sub.name}</div>
          <div class="tile-sub">${count} моделей</div>
        </a>`;
      }).join("")}
    </div>`;
    return;
  }

  // Бренд без подкатегорий - сразу список моделей
  setCrumbs([{label: "Каталог", href: "?"}, {label: catData.name}]);
  renderListing(
    catData.products,
    m => `?cat=${encodeURIComponent(cat)}&model=${encodeURIComponent(m)}`
  );
}

function renderSubcategory(data, cat, sub){
  const catData = data[cat];
  const subData = catData && catData.subcategories && catData.subcategories[sub];
  if (!subData){
    document.getElementById("app").innerHTML = "<div class='state'>Раздел не найден.</div>";
    return;
  }
  setCrumbs([
    {label: "Каталог", href: "?"},
    {label: catData.name, href: `?cat=${encodeURIComponent(cat)}`},
    {label: subData.name},
  ]);
  document.getElementById("pageTitle").textContent = subData.name;
  renderListing(
    subData.products,
    m => `?cat=${encodeURIComponent(cat)}&sub=${encodeURIComponent(sub)}&model=${encodeURIComponent(m)}`
  );
}

function getProduct(data, cat, sub, model){
  const catData = data[cat];
  if (!catData) return null;
  const products = sub
    ? (catData.subcategories && catData.subcategories[sub] ? catData.subcategories[sub].products : null)
    : catData.products;
  if (!products) return null;
  return products.find(p => p.name === model) || null;
}

// Раскладывает вложенную структуру цен товара в плоский список строк для таблицы
function flattenVariants(product){
  const rows = [];
  if (typeof product.price === "number"){
    rows.push({ price: product.price });
    return rows;
  }
  if (!product.prices) return rows;
  if (product.hasMemory){
    Object.entries(product.prices).forEach(([memory, colorMap]) => {
      Object.entries(colorMap).forEach(([color, thirdMap]) => {
        Object.entries(thirdMap).forEach(([third, price]) => {
          if (typeof price === "number") rows.push({ memory, color, third, price });
        });
      });
    });
  } else {
    Object.entries(product.prices).forEach(([color, thirdMap]) => {
      Object.entries(thirdMap).forEach(([third, price]) => {
        if (typeof price === "number") rows.push({ color, third, price });
      });
    });
  }
  return rows;
}

function renderProduct(data, cat, sub, model){
  const catData = data[cat];
  const product = getProduct(data, cat, sub, model);
  if (!product){
    document.getElementById("app").innerHTML = "<div class='state'>Товар не найден.</div>";
    return;
  }

  const crumbs = [{label: "Каталог", href: "?"}, {label: catData.name, href: `?cat=${encodeURIComponent(cat)}`}];
  if (sub){
    const subData = catData.subcategories[sub];
    crumbs.push({label: subData.name, href: `?cat=${encodeURIComponent(cat)}&sub=${encodeURIComponent(sub)}`});
  }
  crumbs.push({label: model});
  setCrumbs(crumbs);
  document.getElementById("pageTitle").textContent = model;

  const rows = flattenVariants(product);

  if (!rows.length){
    document.getElementById("app").innerHTML = "<div class='state'>Цены на эту модель скоро появятся.</div>";
    return;
  }

  // Простой товар без вариантов - одна цена, без сетки
  if (rows.length === 1 && !rows[0].memory && !rows[0].color){
    document.getElementById("app").innerHTML = `
      <div class="price-block" style="border-top:none; padding-top:0;">
        <div class="price">${fmtPrice(rows[0].price)}</div>
        <a class="buy" style="display:inline-block; text-decoration:none;" href="order.html?item=${encodeURIComponent(model)}">Купить за ${fmtPrice(rows[0].price)}</a>
      </div>`;
    return;
  }

  const showThirdLabel = new Set(rows.map(r => r.third).filter(Boolean)).size > 1;

  // Сортируем для стабильного порядка: по памяти, затем по цвету (в порядке появления в данных)
  const memOrder = [...new Set(rows.map(r => r.memory).filter(Boolean))];
  const colorOrder = [...new Set(rows.map(r => r.color).filter(Boolean))];
  rows.sort((a, b) => {
    if (a.memory !== b.memory) return memOrder.indexOf(a.memory) - memOrder.indexOf(b.memory);
    if (a.color !== b.color) return colorOrder.indexOf(a.color) - colorOrder.indexOf(b.color);
    return 0;
  });

  function variantCardHTML(row){
    const subtitleParts = [row.memory, row.color, showThirdLabel ? (REGION_LABEL[row.third] || row.third) : null].filter(Boolean);
    const itemDesc = [model, ...subtitleParts].join(", ");
    const hex = COLOR_HEX[row.color] || { a: "#4f7cff", b: "#152036" };
    return `
      <a class="product-card" href="order.html?item=${encodeURIComponent(itemDesc)}">
        <div class="card-photo"><div class="card-visual" style="--v-a:${hex.a};--v-b:${hex.b};"></div></div>
        <div class="card-body">
          <div class="card-name">${model}</div>
          <div class="card-sub">${subtitleParts.join(" · ")}</div>
          <div class="card-price">${fmtPrice(row.price)}</div>
        </div>
      </a>`;
  }

  document.getElementById("app").innerHTML = `
    <div class="listing-toolbar">
      <span class="listing-count">${rows.length} товаров</span>
    </div>
    <div class="grid">${rows.map(variantCardHTML).join("")}</div>`;
}

fetch("data/catalog.json", { cache: "no-store" })
  .then(r => r.json())
  .then(data => {
    if (catKey && modelKey) renderProduct(data, catKey, subKey, modelKey);
    else if (catKey && subKey) renderSubcategory(data, catKey, subKey);
    else if (catKey) renderCategory(data, catKey);
    else renderHome(data);
  })
  .catch(err => {
    document.getElementById("app").innerHTML = "<div class='state'>Не удалось загрузить каталог.</div>";
    console.error(err);
  });
</script>
<div id="site-footer"></div>
<script src="js/layout.js"></script>
</body>
</html>
